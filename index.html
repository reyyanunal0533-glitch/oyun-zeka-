<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oyun Zeka</title>
<style>
:root{--bg:#0b0d1a;--card:#161a2e;--fg:#e8ecff;--ac:#7c5cff;--ac2:#4de1ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:900px;margin:auto}
header{padding:14px 16px;font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#chat{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.45;background:var(--card);white-space:pre-wrap}
.u{align-self:flex-end;background:var(--ac)}
#box{display:none;padding:0 16px 8px}
#box.on{display:block}
iframe{width:100%;height:46vh;border:1px solid #2a3050;border-radius:12px;background:#000}
.bar{display:flex;gap:8px;margin-top:8px}
.bar button{flex:1;background:var(--card);color:var(--fg);border:1px solid #2a3050;padding:10px;border-radius:10px;font-weight:700}
#f{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
#t{flex:1;padding:12px;border-radius:12px;border:1px solid #2a3050;background:var(--card);color:var(--fg);font-size:16px}
#s{padding:0 20px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:800;font-size:16px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div id="app">
 <header>🎮 Oyun Zeka</header>
 <div id="chat"><div class="m">Merhaba! Ne tür bir oyun istersin? Örnek: "Uzayda 3D asteroit kaçış oyunu" veya "Neon renkli yılan oyunu". Oyun çıkınca "daha hızlı yap", "ses ekle" gibi değişiklikler isteyebilirsin.</div></div>
 <div id="box">
  <iframe id="fr" sandbox="allow-scripts allow-pointer-lock"></iframe>
  <div class="bar"><button id="dl">⬇ İndir (.html)</button><button id="fs">⛶ Yeni sekmede aç</button></div>
 </div>
 <form id="f"><input id="t" placeholder="Oyununu anlat…" autocomplete="off"><button id="s">Yap</button></form>
</div>
<script>
var html="",chat=document.getElementById('chat'),fr=document.getElementById('fr');
function add(c,x){var d=document.createElement('div');d.className='m '+c;d.textContent=x;chat.appendChild(d);chat.scrollTop=1e9;return d}
function show(h){html=h;fr.srcdoc=h;document.getElementById('box').className='on'}
document.getElementById('f').onsubmit=async function(e){
 e.preventDefault();
 var inp=document.getElementById('t'),btn=document.getElementById('s'),p=inp.value.trim();
 if(!p)return;
 inp.value='';add('u',p);btn.disabled=true;
 var w=add('','Oyun hazırlanıyor… (30-90 sn sürebilir)');
 try{
  var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,currentHtml:html})});
  var j=await r.json();
  if(!r.ok)throw new Error(j.error||'Hata');
  show(j.html);w.textContent='Oyun hazır! Yukarıda oynayabilirsin. Değişiklik için yazmaya devam et.';
 }catch(err){w.textContent='Bir sorun oldu: '+err.message}
 btn.disabled=false;
};
document.getElementById('dl').onclick=function(){
 if(!html)return;var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='oyun.html';a.click()};
document.getElementById('fs').onclick=function(){
 if(!html)return;window.open(URL.createObjectURL(new Blob([html],{type:'text/html'})))};
</script>
</body>
</html>
